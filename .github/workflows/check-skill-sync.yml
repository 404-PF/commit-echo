name: Check skill mirrors

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/sync-claude-skills.sh"
      - ".github/workflows/check-skill-sync.yml"
  push:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/sync-claude-skills.sh"
      - ".github/workflows/check-skill-sync.yml"

jobs:
  skill-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Regenerate Claude skill mirror
        run: bash scripts/sync-claude-skills.sh

      - name: Check for drift
        run: |
          set -euo pipefail
          status=0

          if ! git diff --quiet -- .claude/skills; then
            echo "Tracked drift detected in .claude/skills:" >&2
            git diff -- .claude/skills
            status=1
          fi

          changes="$(git status --porcelain=v1 --untracked-files=all -- .claude/skills)"
          if [[ -n "$changes" ]]; then
            echo "Untracked drift detected in .claude/skills:" >&2
            printf "%s\n" "$changes" >&2
            status=1
          fi

          exit "$status"
