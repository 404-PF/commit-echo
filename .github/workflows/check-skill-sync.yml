name: Check skill mirrors

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/sync-claude-skills.sh"
      - ".github/workflows/check-skill-sync.yml"
  push:
    paths:
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "scripts/sync-claude-skills.sh"
      - ".github/workflows/check-skill-sync.yml"

jobs:
  skill-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Regenerate Claude skill mirror
        run: bash scripts/sync-claude-skills.sh

      - name: Check for drift
        run: git diff --exit-code -- .claude/skills && test -z "$(git status --porcelain=v1 --untracked-files=all -- .claude/skills)"
